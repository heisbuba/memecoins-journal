<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Memes Trading Journal</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Memes Journal">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div id="lock-screen">
    <div class="card" id="lock-card">
      <div class="lock-header">
        <div class="lock-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div class="lock-title">Memes Journal</div>
        <div class="lock-subtitle">Enter your PIN to continue</div>
      </div>
      <div class="pin-field">
        <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" aria-label="PIN">
        <button type="button" id="pin-toggle-button" aria-label="Show PIN" aria-pressed="false">
          <svg id="pin-show-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg id="pin-hide-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M17.94 17.94A10.1 10.1 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/>
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
          </svg>
        </button>
      </div>
      <button id="unlock-button">Unlock</button>
      <div id="lock-error" class="negative" role="alert"></div>
    </div>
    <a class="lock-source" href="https://github.com/heisbuba/memecoins-journal" target="_blank" rel="noopener noreferrer">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span>View source on GitHub</span>
    </a>
  </div>

  <main id="app">
    <header class="topbar">
      <h1>Memes Journal <span id="status-text"></span></h1>
      <div class="topbar-controls">
        <label for="period-select">Period</label>
        <select id="period-select" class="period-select" aria-label="Period filter"></select>
        <a class="button-link" href="/patterns">Patterns</a>
        <a class="button-link" href="/charts">Charts</a>
        <button class="secondary" id="lock-button" title="Lock" aria-label="Lock">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>Lock</span>
        </button>
      </div>
    </header>

    <div class="card">
      <h2>Log a trade</h2>
      <div class="form-grid">
        <div><label>Date</label><input id="trade-date" type="date"></div>
        <div><label>Ticker</label><input id="trade-ticker" placeholder="$TICKER"></div>
        <div><label>Strategy</label><input id="trade-strategy" list="strategy-list"><datalist id="strategy-list"></datalist></div>
        <div><label>Entry MC</label><input id="trade-entry-mc" placeholder="118k"></div>
        <div><label>Entry Size</label><input id="trade-entry-size" placeholder="₦5000 or $50" autocomplete="off"></div>
        <div><label>Entry Time</label><input id="trade-entry-time" type="time"></div>
        <div><label>SL (%)</label><input id="trade-stop-loss" placeholder="-20"></div>
        <div><label>TP (%)</label><input id="trade-take-profit" placeholder="100"></div>
        <div><label>RRR (auto)</label><input id="trade-risk-reward" disabled></div>
        <div><label>PnL (%)</label><input id="trade-pnl" placeholder="-34"></div>
        <div><label>Exit MC</label><input id="trade-exit-mc" placeholder="450k"></div> 
        <div><label>Exit Time</label><input id="trade-exit-time" type="time"></div>
        <div>
          <label>Review</label>
          <select id="trade-review">
            <option>Plan</option>
            <option>Mistake</option>
            <option>Unplanned</option>
          </select>
        </div>
        <div class="span-2-columns"><label>Review Tags</label><input id="trade-tags" placeholder="No FOMO, Patience"></div>
        <div class="span-all-columns"><label>Notes</label><textarea id="trade-notes" rows="3"></textarea></div>
      </div>
      <p>
        <button id="save-trade-button">Add trade</button>
        <button class="secondary" id="reload-button">Reload</button>
        <button class="secondary" id="export-csv-button" title="Download CSV" aria-label="Download CSV">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/>
          </svg>
        </button>
        <button class="secondary" id="cancel-edit-button" hidden>Cancel edit</button>
      </p>
    </div>

    <div class="card">
      <h2>Trades Stats</h2>
      <div class="stats-grid" id="stats-summary"></div>
    </div>

    <div class="two-column">
      <div class="card table-scroll">
        <h2>By Strategy</h2>
        <table id="strategy-table"></table>
      </div>
      <div class="card table-scroll">
        <h2>By Time of Day / Review</h2>
        <table id="time-review-table"></table>
      </div>
    </div>

    <div class="card table-scroll">
      <h2>Trades</h2>
      <div class="table-toolbar">
        <input id="search-input" placeholder="Search ticker, strategy, tags, notes, result...">
        <select id="page-size-select" autocomplete="off">
          <option value="10">10 / page</option>
          <option value="20" selected>20 / page</option>
          <option value="50">50 / page</option>
          <option value="100">100 / page</option>
        </select>
      </div>
      <table id="trades-table"></table>
      <div class="pagination">
        <button class="secondary" id="prev-page-button">‹ Prev</button>
        <span id="page-info"></span>
        <button class="secondary" id="next-page-button">Next ›</button>
      </div>
    </div>
  </main>

  <script src="calc.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
