<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Memes Trading Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="lock" style="position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9">
    <div class="card" style="width:280px">
      <h2>Enter PIN</h2>
      <input id="pin" type="password" autocomplete="current-password">
      <p><button id="unlock">Unlock</button> <span id="le" class="r"></span></p>
    </div>
  </div>

  <h1>
    Memes Journal <span id="st"></span>
    <button class="sec" id="lk" style="float:right">Lock</button>
  </h1>

  <div class="card">
    <h2>Log a trade</h2>
    <div class="grid">
      <div><label>Date</label><input id="Date" type="date"></div>
      <div><label>Ticker</label><input id="Ticker" placeholder="$TICKER"></div>
      <div><label>Strategy</label><input id="Strategy" list="sl"><datalist id="sl"></datalist></div>
      <div><label>Entry MC</label><input id="MC" placeholder="118k"></div>
      <div><label>Price</label><input id="Price"></div>
      <div><label>Entry Time</label><input id="Entry Time" type="time"></div>
      <div><label>SL (%)</label><input id="SL" placeholder="-20"></div>
      <div><label>TP (%)</label><input id="TP" placeholder="100"></div>
      <div><label>RRR (auto)</label><input id="RRR" disabled></div>
      <div><label>PnL (%)</label><input id="PnL" placeholder="-34"></div>
      <div><label>Exit MC</label><input id="Exit MC" placeholder="450k"></div> 
      <div><label>Exit Time</label><input id="Exit Time" type="time"></div>
      <div>
        <label>Review</label>
        <select id="Review">
          <option>Plan</option>
          <option>Mistake</option>
          <option>Unplanned</option>
        </select>
      </div>
      <div style="grid-column:span 2"><label>Review Tags</label><input id="Tags" placeholder="No FOMO, Patience"></div>
      <div style="grid-column:1/-1"><label>Notes</label><textarea id="Notes" rows="3"></textarea></div>
    </div>
    <p>
      <button id="add">Add trade</button>
      <button class="sec" id="reload">Reload</button>
      <button class="sec" id="impb">Import CSV / JSON</button>
      <button class="sec" id="exc" title="Download CSV" aria-label="Download CSV">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle">
          <path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/>
        </svg>
      </button>
      <button class="sec" id="cancel" style="display:none">Cancel edit</button>
      <input id="imp" type="file" accept=".csv,.json" hidden>
    </p>
  </div>

  <div class="card">
    <h2>Trades Stats</h2>
    <div class="kpis" id="kpi"></div>
  </div>

  <div class="two">
    <div class="card w">
      <h2>By Strategy</h2>
      <table id="t1"></table>
    </div>
    <div class="card w">
      <h2>By Entry Time</h2>
      <table id="t2"></table>
    </div>
  </div>

  <div class="card w">
    <h2>Trades</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <input id="q" placeholder="Search ticker, strategy, tags, notes, result..." style="flex:1;min-width:200px">
      <select id="ps" style="width:auto">
        <option value="10">10 / page</option>
        <option value="20" selected>20 / page</option>
        <option value="50">50 / page</option>
        <option value="100">100 / page</option>
      </select>
    </div>
    <table id="tb"></table>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
      <button class="sec" id="prev">‹ Prev</button>
      <span id="pi" style="font-size:12px;color:var(--mut)"></span>
      <button class="sec" id="next">Next ›</button>
    </div>
  </div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
